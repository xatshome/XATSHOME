name: Test XATSHOME

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"
      timezone: America/New_York

permissions:
  contents: read

jobs:
  mytest000:
    name: XATSHOME-test000
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Run project workflow
        run: ./.github/workflows/run-workflow.sh
